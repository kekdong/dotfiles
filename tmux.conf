# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

#### Colors / Terminal
# Use tmux-256color when available; fallback for systems without terminfo
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -agq terminal-overrides ',*:Tc'

# Clipboard: safe, version-agnostic defaults
# - Always enable tmux clipboard integration
# - Prefer external passthrough when supported (tmux >= 3.3)
set -gq set-clipboard on
set -gq allow-passthrough on
set -gq set-clipboard external

# Terminals that advertise clipboard support
set -gaq terminal-features 'xterm*:clipboard,tmux*:clipboard,screen*:clipboard'

# Forward focus in/out events to applications (NVIM, shells)
set -g focus-events on

# Prefer zsh for new tmux panes when available
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-command /usr/bin/zsh'
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh'
if-shell '[ -x /bin/zsh ]' 'set -g default-command /bin/zsh'

# Solarized Osaka Dark tmux theme
set -g mode-style "fg=#268bd3,bg=#063540"
set -g message-style "fg=#268bd3,bg=#063540"
set -g message-command-style "fg=#268bd3,bg=#063540"
set -g pane-border-style "fg=#063540"
set -g pane-active-border-style "fg=#268bd3"
set -g status on
set -g status-justify left
set -g status-style "fg=#268bd3,bg=#002c38"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE
setw -g window-status-activity-style "underscore,fg=#9eabac,bg=#002c38"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#9eabac,bg=#002c38"

set -g @prefix_highlight_output_prefix "#[fg=#b28500,bg=#002c38]#[fg=#002c38,bg=#b28500]"
set -g @prefix_highlight_output_suffix ""

# Use plain separators automatically when the shared profile says ascii.
if-shell 'case ${DOTFILES_UI_PROFILE:-nerdfont-truecolor} in ascii-*) exit 0 ;; *) exit 1 ;; esac' \
  'set -g status-left "#[fg=#001014,bg=#268bd3,bold] #S #[fg=#268bd3,bg=#002c38,nobold]>"; set -g status-right "#[fg=#268bd3,bg=#002c38] < #{prefix_highlight} #[fg=#268bd3,bg=#063540] < %Y-%m-%d | %H:%M #[fg=#001014,bg=#268bd3,bold] < #h "; setw -g window-status-format "#[fg=#9eabac,bg=#002c38] #I | #W #F "; setw -g window-status-current-format "#[fg=#268bd3,bg=#063540,bold] #I | #W #F "' \
  'set -g status-left "#[fg=#001014,bg=#268bd3,bold] #S #[fg=#268bd3,bg=#002c38,nobold]"; set -g status-right "#[fg=#002c38,bg=#002c38]#[fg=#268bd3,bg=#002c38] #{prefix_highlight} #[fg=#063540,bg=#002c38]#[fg=#268bd3,bg=#063540] %Y-%m-%d  %H:%M #[fg=#268bd3,bg=#063540]#[fg=#001014,bg=#268bd3,bold] #h "; setw -g window-status-format "#[fg=#002c38,bg=#002c38]#[fg=#9eabac,bg=#002c38] #I  #W #F #[fg=#002c38,bg=#002c38]"; setw -g window-status-current-format "#[fg=#002c38,bg=#063540]#[fg=#268bd3,bg=#063540,bold] #I  #W #F #[fg=#063540,bg=#002c38]"'

bind \\ split-window -h
bind '-' split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind m last-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
setw -g mode-keys vi

# Vim-style copy-mode bindings for character/block selections
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# fzf file picker in a popup; opens the selection with nvim in a new window (Prefix + f)
# Script is linked to ~/.local/bin by install.sh to avoid hardcoding the repo path.
if-shell 'command -v fzf >/dev/null 2>&1' 'bind f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$HOME/.local/bin/tmux-fzf-open"'

run -b "$HOME/.tmux/plugins/tpm/tpm"
